[project]
name = "crewcheck"
version = "0.1.0"
description = "Local crew roster review MVP with deterministic checks and versioned evidence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
