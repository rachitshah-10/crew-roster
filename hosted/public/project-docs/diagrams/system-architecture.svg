<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="title desc"><title id="title">CrewCheck system architecture</title><desc id="desc">A browser calls one FastAPI application with authentication, file validation, deterministic rules and SQLite persistence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#72849b" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="20" fill="#f6f8fc"/><g font-family="Inter,Arial,sans-serif"><text x="44" y="52" font-size="15" font-weight="700" fill="#315ee8">SYSTEM ARCHITECTURE</text><text x="44" y="94" font-size="32" font-weight="650" fill="#142a43">One application. Explicit rules. Saved evidence.</text><rect x="390" y="150" width="640" height="500" rx="18" fill="#edf2ff" stroke="#cdd8fb"/><text x="416" y="184" font-size="15" font-weight="700" fill="#315ee8">APPLICATION SERVER · DEPLOYMENT ADAPTER</text><rect x="44" y="265" width="280" height="180" rx="12" fill="#142a43" stroke="#142a43"/><text x="66" y="299" font-size="20" font-weight="650" fill="white">Browser application</text><text x="66" y="328" font-size="16" font-weight="400" fill="#ccd8ec">Scheduler / Manager</text><text x="66" y="352" font-size="16" font-weight="400" fill="#ccd8ec">Upload • review • history</text><text x="66" y="376" font-size="16" font-weight="400" fill="#ccd8ec">Role-aware controls</text><rect x="418" y="211" width="584" height="102" rx="12" fill="white" stroke="#d8e0ec"/><text x="440" y="245" font-size="20" font-weight="650" fill="#142a43">Access &amp; API</text><text x="440" y="274" font-size="16" font-weight="400" fill="#63738a">Password session · CSRF · ownership · manager permissions</text><rect x="418" y="352" width="274" height="135" rx="12" fill="white" stroke="#d8e0ec"/><text x="440" y="386" font-size="20" font-weight="650" fill="#142a43">File validation</text><text x="440" y="415" font-size="16" font-weight="400" fill="#63738a">CSV / Excel (.xlsx)</text><text x="440" y="439" font-size="16" font-weight="400" fill="#63738a">Schema + UTC timestamps</text><text x="440" y="463" font-size="16" font-weight="400" fill="#63738a">Preview captures rule version</text><rect x="728" y="352" width="274" height="135" rx="12" fill="white" stroke="#d8e0ec"/><text x="750" y="386" font-size="20" font-weight="650" fill="#142a43">Rule engine</text><text x="750" y="415" font-size="16" font-weight="400" fill="#63738a">Duty · rest · overlap</text><text x="750" y="439" font-size="16" font-weight="400" fill="#63738a">Certification expiry</text><text x="750" y="463" font-size="16" font-weight="400" fill="#63738a">Deterministic findings</text><rect x="418" y="529" width="584" height="91" rx="12" fill="white" stroke="#d8e0ec"/><text x="440" y="563" font-size="20" font-weight="650" fill="#142a43">Snapshot &amp; history</text><text x="440" y="592" font-size="16" font-weight="400" fill="#63738a">Source rows + findings + rule version + file hash</text><rect x="1110" y="263" width="346" height="224" rx="12" fill="#142a43" stroke="#142a43"/><text x="1132" y="297" font-size="20" font-weight="650" fill="white">SQLite persistence</text><text x="1132" y="326" font-size="16" font-weight="400" fill="#ccd8ec">Local SQLite / hosted D1</text><text x="1132" y="350" font-size="16" font-weight="400" fill="#ccd8ec">Upload and check snapshots</text><text x="1132" y="374" font-size="16" font-weight="400" fill="#ccd8ec">Versioned rule settings</text><text x="1132" y="398" font-size="16" font-weight="400" fill="#ccd8ec">Append-only audit events</text><path d="M324 295 H368 V260 H418" fill="none" stroke="#72849b" stroke-width="2" marker-end="url(#arrow)"/><text x="206" y="234" font-size="14" font-weight="400" fill="#63738a">Same-origin HTTP</text><path d="M551 313 V352" fill="none" stroke="#72849b" stroke-width="2" marker-end="url(#arrow)"/><text x="566" y="337" font-size="14" font-weight="400" fill="#63738a">Upload</text><path d="M866 313 V352" fill="none" stroke="#72849b" stroke-width="2" marker-end="url(#arrow)"/><text x="881" y="337" font-size="14" font-weight="400" fill="#63738a">Run check</text><path d="M692 418 H728" fill="none" stroke="#72849b" stroke-width="2" marker-end="url(#arrow)"/><path d="M866 487 V529" fill="none" stroke="#72849b" stroke-width="2" marker-end="url(#arrow)"/><text x="881" y="512" font-size="14" font-weight="400" fill="#63738a">Findings</text><path d="M1002 262 H1062 V323 H1110" fill="none" stroke="#72849b" stroke-width="2" marker-end="url(#arrow)"/><text x="1046" y="236" font-size="14" font-weight="400" fill="#63738a">Read / write</text><path d="M1002 573 H1062 V432 H1110" fill="none" stroke="#72849b" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="704" font-size="14" font-weight="700" fill="#315ee8">CHECK LIFECYCLE</text><text x="44" y="739" font-size="21" font-weight="500" fill="#142a43">Validate file → save preview + rule version → run checks → save immutable result → human review</text><text x="1110" y="543" font-size="17" font-weight="650" fill="#142a43">Demo deployment boundary</text><text x="1110" y="574" font-size="16" font-weight="400" fill="#63738a">No LLM or external data feeds.</text><text x="1110" y="601" font-size="16" font-weight="400" fill="#63738a">Original file bytes are discarded;</text><text x="1110" y="627" font-size="16" font-weight="400" fill="#63738a">normalized rows are retained.</text><text x="44" y="776" font-size="15" font-weight="650" fill="#315ee8">PLANNED INTERNAL ROLLOUT: PostgreSQL + employee authentication + governed audit retention</text></g></svg>