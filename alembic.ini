# Alembic CLI configuration. The app applies migrations automatically at startup;
# use the CLI to author new ones, e.g.:
#   CREWCHECK_DATABASE_URL=sqlite:///data/crewcheck.db uv run alembic revision -m "add column"
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
